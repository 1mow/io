<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Панель управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506;--panel:#0a0a0c;--ink:#e9e6e1;--dim:#8a8680;--faint:#4a4743;
  --line:rgba(255,255,255,.09);--accent:#b3122b;--accent-2:#e23a52;--gold:#c9a66b;--ok:#4fbf8a;
  --serif:'Cormorant Garamond',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 80% -10%,rgba(179,18,43,.16),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(201,166,107,.06),transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.hidden{display:none!important}
::selection{background:var(--accent);color:#fff}

/* ---------- вход ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:400px;background:rgba(10,10,12,.85);border:1px solid var(--line);padding:46px 38px 40px;backdrop-filter:blur(12px);position:relative}
.box::before{content:"";position:absolute;left:-1px;top:-1px;width:48px;height:48px;border-top:1px solid var(--accent-2);border-left:1px solid var(--accent-2)}
.box::after{content:"";position:absolute;right:-1px;bottom:-1px;width:48px;height:48px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:var(--accent-2);text-transform:uppercase;margin-bottom:14px}
h1{font-family:var(--serif);font-weight:500;font-size:40px;margin-bottom:34px}
label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
input[type=text],input[type=password],textarea{
  width:100%;background:rgba(255,255,255,.025);border:1px solid var(--line);color:var(--ink);padding:14px 16px;font:400 15px var(--sans);outline:none;transition:border-color .3s,background .3s;
}
input:focus,textarea:focus{border-color:var(--accent-2);background:rgba(179,18,43,.06)}
textarea{min-height:170px;resize:vertical;line-height:1.6}
.field{margin-bottom:22px}
.btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;color:var(--ink);
  border:1px solid var(--line);background:rgba(255,255,255,.03);padding:14px 22px;transition:all .3s;
}
.btn:hover{border-color:var(--accent-2);background:rgba(179,18,43,.18)}
.btn.primary{border-color:rgba(179,18,43,.75);background:rgba(179,18,43,.22)}
.btn.primary:hover{background:var(--accent)}
.btn.ghost{color:var(--dim)}
.btn.danger:hover{background:rgba(179,18,43,.35)}
.btn:disabled{opacity:.4;cursor:wait}
.full{width:100%;margin-top:6px}
.err{font-family:var(--mono);font-size:12px;color:var(--accent-2);min-height:18px;margin-top:16px}

/* ---------- панель ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);background:rgba(5,5,6,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.bar .brand{font-family:var(--serif);font-size:26px;display:flex;align-items:center;gap:14px}
.bar .brand small{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--accent-2);text-transform:uppercase}
.bar .actions{display:flex;gap:10px}
.wrap{max-width:1100px;margin:0 auto;padding:36px clamp(18px,4vw,48px) 90px;display:grid;gap:26px}
.card{background:rgba(10,10,12,.82);border:1px solid var(--line);padding:30px clamp(20px,3vw,36px);backdrop-filter:blur(8px)}
.card h2{font-family:var(--serif);font-weight:500;font-size:28px;margin-bottom:6px}
.card .sub{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em;margin-bottom:26px}
.row{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:11px;color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:860px){.two{grid-template-columns:1fr}}

.preview{position:relative;background:#09090b;border:1px dashed rgba(255,255,255,.14);display:grid;place-items:center;overflow:hidden;margin-bottom:18px;color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.preview.avatar{width:170px;height:170px;border-radius:50%}
.preview.bg{width:100%;aspect-ratio:16/9}
.preview img,.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop{border:1px dashed rgba(255,255,255,.16);padding:18px;text-align:center;cursor:pointer;color:var(--dim);font-size:13px;transition:all .3s;margin-bottom:14px}
.drop:hover,.drop.over{border-color:var(--accent-2);color:var(--ink);background:rgba(179,18,43,.07)}
.drop small{display:block;margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint)}
.progress{height:2px;background:var(--line);margin-bottom:14px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .15s}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);opacity:0;background:#101013;border:1px solid var(--line);padding:14px 24px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;transition:all .4s;z-index:20}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.ok{border-color:rgba(79,191,138,.5);color:var(--ok)}
.toast.bad{border-color:rgba(226,58,82,.6);color:var(--accent-2)}
</style>
</head>
<body>

<!-- вход -->
<div class="login" id="login">
  <form class="box" id="loginForm" autocomplete="on">
    <div class="tag">// restricted area</div>
    <h1>Доступ</h1>
    <div class="field"><label for="l">Логин</label><input type="text" id="l" name="username" autocomplete="username" autofocus required></div>
    <div class="field"><label for="p">Пароль</label><input type="password" id="p" name="password" autocomplete="current-password" required></div>
    <button class="btn primary full" type="submit" id="loginBtn">Войти</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- панель -->
<div id="panel" class="hidden">
  <div class="bar">
    <div class="brand">Панель <small>control</small></div>
    <div class="actions">
      <a class="btn ghost" href="/" target="_blank" style="text-decoration:none">Сайт ↗</a>
      <button class="btn ghost" id="logout">Выйти</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>Профиль</h2>
      <div class="sub">никнейм и описание на главной странице</div>
      <div class="field">
        <label for="nick">Никнейм</label>
        <input type="text" id="nick" maxlength="32">
      </div>
      <div class="field">
        <div class="row"><label for="desc">Описание</label><span class="count" id="cnt">0 / 1500</span></div>
        <textarea id="desc" maxlength="1500"></textarea>
      </div>
      <button class="btn primary" id="saveProfile">Сохранить</button>
    </div>

    <div class="two">
      <div class="card">
        <h2>Аватарка</h2>
        <div class="sub">фото или видео · видео играет по кругу без звука</div>
        <div class="preview avatar" id="avPrev">нет</div>
        <label class="drop" id="avDrop" for="avFile">Выбрать или перетащить файл<small>JPG · PNG · WEBP · GIF · MP4 · WEBM · до 30 МБ</small></label>
        <input type="file" id="avFile" accept="image/*,video/mp4,video/webm,video/ogg,video/quicktime" class="hidden">
        <div class="progress"><i id="avBar"></i></div>
        <div class="btns"><button class="btn danger" id="avDel">Убрать</button></div>
      </div>

      <div class="card">
        <h2>Фон</h2>
        <div class="sub">фото или видео на весь сайт · затемняется автоматически</div>
        <div class="preview bg" id="bgPrev">нет</div>
        <label class="drop" id="bgDrop" for="bgFile">Выбрать или перетащить файл<small>JPG · PNG · WEBP · GIF · MP4 · WEBM · до 300 МБ</small></label>
        <input type="file" id="bgFile" accept="image/*,video/mp4,video/webm,video/ogg,video/quicktime" class="hidden">
        <div class="progress"><i id="bgBar"></i></div>
        <div class="btns"><button class="btn danger" id="bgDel">Убрать</button></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var toastT;
  function toast(msg,ok){
    var t=$('toast');t.textContent=msg;t.className='toast show '+(ok?'ok':'bad');
    clearTimeout(toastT);toastT=setTimeout(function(){t.className='toast'},2800);
  }
  function api(url,opt){
    opt=opt||{};opt.credentials='same-origin';
    return fetch(url,opt).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(r.status===401&&url!=='/api/login'){showLogin()}
        if(!r.ok)throw new Error(j.error||'Ошибка');
        return j;
      });
    });
  }
  function showLogin(){$('panel').classList.add('hidden');$('login').classList.remove('hidden')}
  function showPanel(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}

  function renderMedia(box,m,emptyText){
    box.innerHTML='';
    if(!m||!m.url){box.textContent=emptyText;return}
    var n;
    if(m.type==='video'){n=document.createElement('video');n.src=m.url;n.autoplay=true;n.muted=true;n.loop=true;n.playsInline=true}
    else{n=document.createElement('img');n.src=m.url;n.alt=''}
    box.appendChild(n);
  }
  function fill(p){
    $('nick').value=p.nickname||'';
    $('desc').value=p.description||'';
    $('cnt').textContent=($('desc').value.length)+' / 1500';
    renderMedia($('avPrev'),p.avatar,'нет');
    renderMedia($('bgPrev'),p.background,'нет');
  }
  function load(){api('/api/profile').then(fill).catch(function(){})}

  // вход
  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    $('loginErr').textContent='';$('loginBtn').disabled=true;
    api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:$('l').value,password:$('p').value})})
    .then(function(){$('p').value='';showPanel()})
    .catch(function(err){$('loginErr').textContent=err.message})
    .then(function(){$('loginBtn').disabled=false});
  });
  $('logout').onclick=function(){api('/api/logout',{method:'POST'}).then(showLogin)};

  // профиль
  $('desc').addEventListener('input',function(){$('cnt').textContent=this.value.length+' / 1500'});
  $('saveProfile').onclick=function(){
    var b=this;b.disabled=true;
    api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({nickname:$('nick').value,description:$('desc').value})})
    .then(function(p){fill(p);toast('Сохранено',true)})
    .catch(function(e){toast(e.message,false)})
    .then(function(){b.disabled=false});
  };

  // загрузки
  function setupUpload(kind,fileId,dropId,barId,delId,prevId,emptyText){
    var input=$(fileId),drop=$(dropId),bar=$(barId);
    function send(file){
      if(!file)return;
      var fd=new FormData();fd.append('file',file);
      var xhr=new XMLHttpRequest();
      xhr.open('POST','/api/upload/'+kind);
      xhr.upload.onprogress=function(e){if(e.lengthComputable)bar.style.width=(e.loaded/e.total*100)+'%'};
      xhr.onload=function(){
        bar.style.width='0';
        var j={};try{j=JSON.parse(xhr.responseText)}catch(e){}
        if(xhr.status===401){showLogin();return}
        if(xhr.status>=200&&xhr.status<300){fill(j);toast('Загружено',true)}
        else toast(j.error||'Ошибка загрузки',false);
      };
      xhr.onerror=function(){bar.style.width='0';toast('Сеть недоступна',false)};
      xhr.send(fd);
    }
    input.onchange=function(){send(input.files[0]);input.value=''};
    ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
    ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
    drop.addEventListener('drop',function(e){send(e.dataTransfer.files[0])});
    $(delId).onclick=function(){
      api('/api/upload/'+kind,{method:'DELETE'}).then(function(p){fill(p);toast('Убрано',true)}).catch(function(e){toast(e.message,false)});
    };
  }
  setupUpload('avatar','avFile','avDrop','avBar','avDel','avPrev','нет');
  setupUpload('background','bgFile','bgDrop','bgBar','bgDel','bgPrev','нет');

  // старт
  api('/api/me').then(function(r){r.authed?showPanel():showLogin()}).catch(showLogin);
})();
</script>
</body>
</html>
